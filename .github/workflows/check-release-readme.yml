name: Check release README
on: push
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare README with release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r /tmp/u
          tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then echo "RESULT=NO_RELEASE"; exit 0; fi
          gh release download "$tag" --pattern '*.zip' --dir /tmp/r
          z="$(find /tmp/r -name '*.zip' | head -n1)"
          [ -n "$z" ] || { echo "RESULT=NO_ZIP"; exit 0; }
          unzip -q "$z" -d /tmp/u
          r="$(find /tmp/u -type f -iname README.md -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)"
          [ -f README.md ] || { echo "RESULT=REPO_README_MISSING"; exit 0; }
          [ -n "$r" ] || { echo "RESULT=ZIP_README_MISSING"; exit 0; }
          tr -d '\r' < README.md > /tmp/a
          tr -d '\r' < "$r" > /tmp/b
          cmp -s /tmp/a /tmp/b && echo "RESULT=MATCH" || echo "RESULT=MISMATCH"
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-release-readme.yml
          git commit -m "Remove temporary README check workflow"
          git push
